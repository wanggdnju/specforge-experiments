# Generated by gen_configs.py (specforge-experiments) -- do not edit by hand.
#
# algorithm:       domino
# initialisation:  warmstart
# draft layers:    [1, 9, 17, 25, 33]
# batch size:      2
# vocab mapping:   not used
#
# Regenerate with:
#   ./run.sh pipeline configs     (or: python 2_train/gen_configs.py --out-dir <dir>)

model:
  target_model_path: ../../model/Qwen3-8B
  # draft_model_config omitted: the checkpoint carries config.json and
  # the two are mutually exclusive as init sources.
  draft_checkpoint_path: ../../model/Qwen3-8B-Domino-b16
  target_backend: sglang
  embedding_key: model.embed_tokens.weight
  torch_dtype: bfloat16
  sglang_mem_fraction_static: 0.3

data:
  train_data_path: artifacts/datasets/v4-data1/train.jsonl
  max_length: 2048
  chat_template: qwen
  cache_dir: ../../data/specforge/cache

training:
  strategy: domino
  num_epochs: 3
  batch_size: 2
  accumulation_steps: 4
  learning_rate: 2.0e-4
  warmup_ratio: 0.04
  max_grad_norm: 1.0
  attention_backend: flex_attention
  num_anchors: 512
  loss_decay_gamma: 7.0
  save_interval: 1000
  max_checkpoints: 2
  log_interval: 10
  dist_timeout: 60
  seed: 42

runtime:
  in_flight_high_watermark: 32
  in_flight_low_watermark: 16

tracking:
  report_to: tensorboard

run_id: bench-domino-warmstart
output_dir: artifacts/runs/bench-domino-warmstart

deployment:
  mode: disaggregated
  trainer:
    nnodes: 1
    nproc_per_node: 1
  disaggregated:
    control_dir: artifacts/runs/bench-domino-warmstart/control
    consumer_state_dir: artifacts/runs/bench-domino-warmstart/consumer-state
    backend: mooncake
    server_urls:
      - http://127.0.0.1:30000
    mooncake_metadata_server: http://127.0.0.1:35880/metadata
    mooncake_master_server_addr: 127.0.0.1:35551
    mooncake_protocol: tcp
    receive_buffers: pageable
    client_buffer_size: 4294967296
    receive_pool_bytes: 1073741824
